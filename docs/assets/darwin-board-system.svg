<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Darwin Board system loop</title>
  <desc id="description">A target response flows through experience-guided search, a reconfigurable circuit, ESP32 self-measurement, health monitoring, and recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b92a1"/>
    </marker>
    <style>
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #9ca3b3; }
      .title { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f4ef; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9cdd6; }
      .value { font: 500 17px "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #f3f4ef; }
      .box { fill: #191c22; stroke: #353b47; stroke-width: 1.5; }
      .line { fill: none; stroke: #8b92a1; stroke-width: 2; marker-end: url(#arrow); }
      .blue { stroke: #7fa2f2; }
      .green { stroke: #72c69b; }
      .red { stroke: #e17d70; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="18" fill="#101216"/>
  <text x="54" y="52" class="label">DARWIN BOARD / MILESTONE 0.3</text>
  <text x="54" y="88" class="title">A circuit that learns, remembers, and recovers</text>

  <rect x="54" y="145" width="205" height="120" rx="10" class="box"/>
  <text x="76" y="176" class="label">01 / INTENT</text>
  <text x="76" y="209" class="value">Target response</text>
  <text x="76" y="236" class="body">Cutoff frequency</text>

  <rect x="325" y="145" width="245" height="120" rx="10" class="box"/>
  <text x="347" y="176" class="label">02 / LEARN</text>
  <text x="347" y="209" class="value">Bayesian search</text>
  <text x="347" y="236" class="body">Memory + uncertainty</text>

  <rect x="636" y="145" width="245" height="120" rx="10" class="box"/>
  <text x="658" y="176" class="label">03 / ACT</text>
  <text x="658" y="209" class="value">RC switch fabric</text>
  <text x="658" y="236" class="body">378 hardware paths</text>

  <rect x="947" y="145" width="205" height="120" rx="10" class="box"/>
  <text x="969" y="176" class="label">04 / SENSE</text>
  <text x="969" y="209" class="value">ESP32 transient</text>
  <text x="969" y="236" class="body">DAC step + ADC fit</text>

  <path d="M 259 205 H 325" class="line blue"/>
  <path d="M 570 205 H 636" class="line blue"/>
  <path d="M 881 205 H 947" class="line blue"/>
  <path d="M 1050 265 V 315 H 447 V 265" class="line"/>

  <rect x="214" y="365" width="260" height="120" rx="10" class="box"/>
  <text x="236" y="396" class="label">05 / REMEMBER</text>
  <text x="236" y="429" class="value">Healthy signature</text>
  <text x="236" y="456" class="body">Median of three sweeps</text>

  <rect x="526" y="365" width="210" height="120" rx="10" class="box"/>
  <text x="548" y="396" class="label">06 / DETECT</text>
  <text x="548" y="429" class="value">Evidence gate</text>
  <text x="548" y="456" class="body">Drift or open path</text>

  <rect x="788" y="365" width="260" height="120" rx="10" class="box"/>
  <text x="810" y="396" class="label">07 / RECOVER</text>
  <text x="810" y="429" class="value">New hardware path</text>
  <text x="810" y="456" class="body">Target response restored</text>

  <path d="M 474 425 H 526" class="line red"/>
  <path d="M 736 425 H 788" class="line green"/>
  <path d="M 918 365 V 320 H 758 V 265" class="line green"/>
</svg>
