<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title description">
  <title id="title">Darwin Board architecture</title>
  <desc id="description">The controller searches circuit genotypes, configures and measures a path, activates it, monitors its health, and loads a backup after a fault.</desc>

  <style>
    .box, .box-accent { fill: #ececff; stroke: #9370db; stroke-width: 3; }
    .label { fill: #131300; font: 600 22px "Trebuchet MS", Verdana, Arial, sans-serif; text-anchor: middle; }
    .note { fill: #333333; font: 600 18px "Trebuchet MS", Verdana, Arial, sans-serif; text-anchor: middle; }
    .line { fill: none; stroke: #333333; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrow { fill: #333333; }

    @media (prefers-color-scheme: dark) {
      .box, .box-accent { fill: #1f2020; stroke: #81b1db; }
      .label { fill: #f3f4f6; }
      .note { fill: #d1d5db; }
      .line { stroke: #d1d5db; }
      .arrow { fill: #d1d5db; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="55" width="200" height="90" rx="16"/>
  <text class="label" x="120" y="91">
    <tspan x="120">Set target</tspan>
    <tspan x="120" dy="28">frequency</tspan>
  </text>

  <rect class="box" x="260" y="55" width="200" height="90" rx="16"/>
  <text class="label" x="360" y="91">
    <tspan x="360">Search and rank</tspan>
    <tspan x="360" dy="28">genotypes</tspan>
  </text>

  <rect class="box" x="500" y="55" width="200" height="90" rx="16"/>
  <text class="label" x="600" y="91">
    <tspan x="600">Configure and</tspan>
    <tspan x="600" dy="28">measure</tspan>
  </text>

  <rect class="box-accent" x="740" y="55" width="200" height="90" rx="16"/>
  <text class="label" x="840" y="91">
    <tspan x="840">Activate path</tspan>
    <tspan x="840" dy="28">qualify backups</tspan>
  </text>

  <rect class="box" x="980" y="55" width="200" height="90" rx="16"/>
  <text class="label" x="1080" y="91">
    <tspan x="1080">Monitor</tspan>
    <tspan x="1080" dy="28">circuit health</tspan>
  </text>

  <rect class="box-accent" x="980" y="210" width="200" height="80" rx="16"/>
  <text class="label" x="1080" y="244">
    <tspan x="1080">Load a</tspan>
    <tspan x="1080" dy="28">backup path</tspan>
  </text>

  <path class="line" d="M 220 100 H 252"/>
  <path class="line" d="M 460 100 H 492"/>
  <path class="line" d="M 700 100 H 732"/>
  <path class="line" d="M 940 100 H 972"/>

  <path class="line" d="M 600 145 V 185 H 360 V 153"/>
  <text class="note" x="480" y="208">Outside tolerance</text>

  <path class="line" d="M 1080 145 V 202"/>
  <text class="note" x="1005" y="181">Fault detected</text>

  <path class="line" d="M 980 250 H 600 V 153"/>
</svg>
